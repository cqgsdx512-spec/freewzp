<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>党员政治生日贺卡</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    overflow-x: hidden;
  }

  body {
    background: linear-gradient(135deg, #8B0000 0%, #D93636 50%, #A51515 100%);
    background-attachment: fixed;
    min-height: 100vh;
    position: relative;
  }

  /* 党徽水印背景 */
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><g opacity='0.06'><circle cx='100' cy='100' r='90' fill='none' stroke='%23E5C07B' stroke-width='3'/><path d='M60 70 Q100 50 140 70 Q150 100 140 130 Q100 150 60 130 Q50 100 60 70 Z' fill='%23E5C07B'/><text x='100' y='115' font-size='40' text-anchor='middle' fill='%238B0000' font-weight='bold'>党</text></g></svg>");
    background-repeat: repeat;
    background-size: 220px 220px;
    pointer-events: none;
    z-index: 0;
  }

  /* ============ 查询页 ============ */
  .query-page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .query-page.hide {
    opacity: 0;
    transform: scale(0.95);
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  .emblem-large {
    width: 110px;
    height: 110px;
    margin-bottom: 24px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    animation: emblemFloat 3s ease-in-out infinite;
  }

  @keyframes emblemFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .title-main {
    font-size: 28px;
    font-weight: 700;
    color: #E5C07B;
    text-align: center;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    margin-bottom: 8px;
  }

  .title-sub {
    font-size: 14px;
    color: rgba(255, 230, 180, 0.8);
    letter-spacing: 2px;
    margin-bottom: 50px;
    text-align: center;
  }

  .query-card {
    width: 100%;
    max-width: 360px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(229, 192, 123, 0.3);
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  }

  .query-card label {
    display: block;
    font-size: 15px;
    color: #E5C07B;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .input-wrap {
    position: relative;
    margin-bottom: 24px;
  }

  .input-wrap input {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.95);
    padding: 0 18px;
    font-size: 16px;
    color: #333;
    outline: none;
    transition: box-shadow 0.3s;
  }

  .input-wrap input::placeholder {
    color: #aaa;
  }

  .input-wrap input:focus {
    box-shadow: 0 0 0 3px rgba(229, 192, 123, 0.5);
  }

  .btn-query {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #E5C07B 0%, #D4A85F 100%);
    color: #8B0000;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 16px rgba(229, 192, 123, 0.35);
  }

  .btn-query:active {
    transform: scale(0.97);
    box-shadow: 0 2px 8px rgba(229, 192, 123, 0.35);
  }

  /* ============ 贺卡页 ============ */
  .card-page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    opacity: 0;
    transform: perspective(1500px) rotateY(90deg);
    transform-origin: left center;
    transition: opacity 0.8s ease, transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
  }

  .card-page.show {
    opacity: 1;
    transform: perspective(1500px) rotateY(0deg);
    pointer-events: auto;
    position: relative;
  }

  .birthday-card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(160deg, #FFF8E7 0%, #FFFCF5 50%, #FFF3D6 100%);
    border-radius: 18px;
    padding: 36px 26px 30px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(229, 192, 123, 0.4);
    position: relative;
    overflow: hidden;
  }

  /* 贺卡顶部红色装饰条 */
  .birthday-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #D93636 0%, #E5C07B 50%, #D93636 100%);
  }

  /* 贺卡角花装饰 */
  .birthday-card::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: 0;
    width: 120px;
    height: 120px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><g opacity='0.08' fill='%23D93636'><path d='M120 0 L120 120 L0 120 Q120 60 120 0 Z'/></g></svg>");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: bottom right;
    pointer-events: none;
  }

  .card-emblem {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    display: block;
  }

  .card-header-title {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: #D93636;
    letter-spacing: 4px;
    margin-bottom: 6px;
  }

  .card-header-sub {
    text-align: center;
    font-size: 13px;
    color: #B8902E;
    letter-spacing: 2px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px dashed rgba(229, 192, 123, 0.6);
  }

  .card-info {
    background: rgba(217, 54, 54, 0.04);
    border-radius: 12px;
    padding: 18px 16px;
    margin-bottom: 20px;
    border: 1px solid rgba(229, 192, 123, 0.3);
  }

  .info-row {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
  }

  .info-row:last-child {
    margin-bottom: 0;
  }

  .info-label {
    font-size: 14px;
    color: #B8902E;
    flex-shrink: 0;
    width: 75px;
    letter-spacing: 1px;
  }

  .info-value {
    font-size: 16px;
    color: #333;
    font-weight: 600;
    flex: 1;
  }

  .info-value .highlight {
    color: #D93636;
    font-size: 18px;
  }

  .message-section {
    margin-bottom: 24px;
  }

  .message-title {
    font-size: 14px;
    color: #B8902E;
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-align: center;
  }

  .message-content {
    font-size: 15px;
    line-height: 1.8;
    color: #555;
    text-align: center;
    padding: 14px 12px;
    background: rgba(229, 192, 123, 0.1);
    border-radius: 10px;
    border-left: 3px solid #E5C07B;
    font-style: italic;
  }

  .card-footer {
    text-align: center;
    font-size: 12px;
    color: #B8902E;
    letter-spacing: 1px;
    margin-top: 18px;
  }

  .btn-back {
    margin-top: 28px;
    width: 100%;
    max-width: 380px;
    height: 48px;
    border: 1.5px solid rgba(229, 192, 123, 0.6);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #E5C07B;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-back:active {
    background: rgba(229, 192, 123, 0.2);
    transform: scale(0.97);
  }

  /* ============ 提示弹窗 ============ */
  .toast-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .toast-mask.show {
    opacity: 1;
    pointer-events: auto;
  }

  .toast-box {
    width: 80%;
    max-width: 320px;
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px 20px;
    text-align: center;
    transform: scale(0.8);
    transition: transform 0.3s;
  }

  .toast-mask.show .toast-box {
    transform: scale(1);
  }

  .toast-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 14px;
    background: linear-gradient(135deg, #D93636 0%, #A51515 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #E5C07B;
    font-size: 26px;
    font-weight: 700;
  }

  .toast-text {
    font-size: 15px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .toast-btn {
    width: 100%;
    height: 44px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #D93636 0%, #A51515 100%);
    color: #fff;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
  }

  .toast-btn:active {
    opacity: 0.85;
  }

  /* 响应式适配 */
  @media (max-width: 360px) {
    .title-main { font-size: 24px; }
    .birthday-card { padding: 30px 20px 26px; }
    .card-header-title { font-size: 20px; }
    .info-value { font-size: 15px; }
  }

  @media (max-height: 600px) {
    .query-page { justify-content: flex-start; padding-top: 50px; }
    .card-page { justify-content: flex-start; padding-top: 30px; }
  }
</style>
</head>
<body>

<!-- 党徽 SVG 定义 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="partyEmblem" viewBox="0 0 100 100">
      <!-- 外圈 -->
      <circle cx="50" cy="50" r="46" fill="#D93636" stroke="#E5C07B" stroke-width="2.5"/>
      <!-- 镰刀 -->
      <path d="M30 32 Q22 45 28 62 Q34 70 44 70 Q36 64 34 54 Q33 42 42 34 Z" fill="#E5C07B"/>
      <!-- 锤头 -->
      <path d="M52 30 L66 24 L70 30 L56 36 Z" fill="#E5C07B"/>
      <!-- 锤柄 -->
      <rect x="50" y="34" width="4" height="32" rx="1.5" fill="#E5C07B" transform="rotate(-15 52 50)"/>
      <!-- 党字 -->
      <text x="50" y="82" font-size="14" text-anchor="middle" fill="#E5C07B" font-weight="bold" font-family="serif">党</text>
    </symbol>
  </defs>
</svg>

<!-- ============ 查询页 ============ -->
<div class="query-page" id="queryPage">
  <svg class="emblem-large" viewBox="0 0 100 100">
    <use href="#partyEmblem"/>
  </svg>
  <h1 class="title-main">党员政治生日贺卡</h1>
  <p class="title-sub">不忘初心 · 牢记使命</p>

  <div class="query-card">
    <label for="nameInput">请输入您的姓名</label>
    <div class="input-wrap">
      <input type="text" id="nameInput" placeholder="请输入姓名" autocomplete="off" maxlength="20">
    </div>
    <button class="btn-query" id="btnQuery">查询贺卡</button>
  </div>
</div>

<!-- ============ 贺卡页 ============ -->
<div class="card-page" id="cardPage">
  <div class="birthday-card" id="birthdayCard">
    <svg class="card-emblem" viewBox="0 0 100 100">
      <use href="#partyEmblem"/>
    </svg>
    <h2 class="card-header-title">政治生日贺卡</h2>
    <p class="card-header-sub">POLITICAL BIRTHDAY CARD</p>

    <div class="card-info">
      <div class="info-row">
        <span class="info-label">姓　　名</span>
        <span class="info-value" id="cardName">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">入党日期</span>
        <span class="info-value" id="cardDate">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">党　　龄</span>
        <span class="info-value"><span class="highlight" id="cardAge">—</span> 年</span>
      </div>
    </div>

    <div class="message-section">
      <p class="message-title">— 组织寄语 —</p>
      <div class="message-content" id="cardMessage">—</div>
    </div>

    <p class="card-footer">中共××支部委员会　敬贺</p>
  </div>

  <button class="btn-back" id="btnBack">返回首页</button>
</div>

<!-- ============ 提示弹窗 ============ -->
<div class="toast-mask" id="toastMask">
  <div class="toast-box">
    <div class="toast-icon">!</div>
    <p class="toast-text" id="toastText">未查询到您的政治生日信息，请联系党支部核实</p>
    <button class="toast-btn" id="toastBtn">我知道了</button>
  </div>
</div>

<script>
  // ============ 模拟党员数据 ============
  var partyMembers = [
    { name: "李建国", joinDate: "2008-07-01", age: 18, message: "初心如磐，使命在肩。十八载党龄，矢志不渝。祝您政治生日快乐！" },
    { name: "王淑芬", joinDate: "2012-06-15", age: 14, message: "一心向党，赤诚奉献。感谢您十四年来为党的事业辛勤付出。" },
    { name: "张志强", joinDate: "2015-11-20", age: 11, message: "砥砺前行，不负韶华。愿您永葆党员本色，再创崭新业绩！" },
    { name: "刘红梅", joinDate: "2019-07-01", age: 7, message: "信仰坚定，初心不忘。七年同行，感恩有您。政治生日快乐！" },
    { name: "陈伟东", joinDate: "2005-03-12", age: 21, message: "廿一春秋，党性长青。向您致敬，祝政治生日快乐，阖家幸福！" },
    { name: "赵晓燕", joinDate: "2020-10-01", age: 6, message: "青春向党，奋斗有我。六年成长路，愿您继续谱写奋斗华章。" },
    { name: "孙德海", joinDate: "2001-07-01", age: 25, message: "四分之一世纪，初心不改。银发党员，精神永驻。致敬老同志！" },
    { name: "周丽萍", joinDate: "2017-05-04", age: 9, message: "五四入党，青春无悔。九年坚守岗位，您是群众心中的旗帜。" },
    { name: "吴国栋", joinDate: "2013-12-08", age: 13, message: "十三个春秋，砥砺奋进。愿您继续发挥先锋模范作用，再立新功！" },
    { name: "郑秀英", joinDate: "2010-09-01", age: 16, message: "花开十六载，丹心映党旗。感谢您一路的坚守与付出，生日快乐！" }
  ];

  // ============ DOM 元素 ============
  var queryPage = document.getElementById("queryPage");
  var cardPage = document.getElementById("cardPage");
  var nameInput = document.getElementById("nameInput");
  var btnQuery = document.getElementById("btnQuery");
  var btnBack = document.getElementById("btnBack");
  var toastMask = document.getElementById("toastMask");
  var toastBtn = document.getElementById("toastBtn");

  // ============ 格式化日期 ============
  function formatDate(dateStr) {
    var d = new Date(dateStr);
    var y = d.getFullYear();
    var m = (d.getMonth() + 1).toString().padStart(2, "0");
    var day = d.getDate().toString().padStart(2, "0");
    return y + "年" + m + "月" + day + "日";
  }

  // ============ 显示提示弹窗 ============
  function showToast(text) {
    var toastText = document.getElementById("toastText");
    toastText.textContent = text;
    toastMask.classList.add("show");
  }

  // ============ 查询贺卡 ============
  function queryCard() {
    var name = nameInput.value.trim();
    if (!name) {
      showToast("请输入您的姓名");
      return;
    }

    // 查找匹配的党员
    var member = null;
    for (var i = 0; i < partyMembers.length; i++) {
      if (partyMembers[i].name === name) {
        member = partyMembers[i];
        break;
      }
    }

    if (member) {
      // 填充贺卡数据
      document.getElementById("cardName").textContent = member.name;
      document.getElementById("cardDate").textContent = formatDate(member.joinDate);
      document.getElementById("cardAge").textContent = member.age;
      document.getElementById("cardMessage").textContent = member.message;

      // 切换到贺卡页（翻书动画）
      queryPage.classList.add("hide");
      setTimeout(function() {
        cardPage.classList.add("show");
        // 滚动到顶部
        window.scrollTo(0, 0);
      }, 300);
    } else {
      // 未查询到
      showToast("未查询到您的政治生日信息，请联系党支部核实");
    }
  }

  // ============ 返回首页 ============
  function backToHome() {
    cardPage.classList.remove("show");
    setTimeout(function() {
      queryPage.classList.remove("hide");
      nameInput.value = "";
      window.scrollTo(0, 0);
    }, 500);
  }

  // ============ 事件绑定 ============
  btnQuery.addEventListener("click", queryCard);
  btnBack.addEventListener("click", backToHome);
  toastBtn.addEventListener("click", function() {
    toastMask.classList.remove("show");
  });

  // 回车键查询
  nameInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.keyCode === 13) {
      queryCard();
    }
  });

  // 点击遮罩关闭弹窗
  toastMask.addEventListener("click", function(e) {
    if (e.target === toastMask) {
      toastMask.classList.remove("show");
    }
  });
</script>

</body>
</html>
